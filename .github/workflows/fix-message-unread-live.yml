name: Fix live message unread state
on:
  push:
    paths: ['.github/workflows/fix-message-unread-live.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Patch live read state, badges, and unread styling
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Message thread: retry mark-read once messages actually arrive,
          # and re-run for realtime messages while the open thread is visible.
          p = Path('src/components/message-thread.tsx')
          s = p.read_text()
          old = '''  // Mark read when conversation is first opened or switches\n  useEffect(() => {\n    if (!clientId || !messages.length) return;\n    markRead(clientId, role).then(() => {\n      qc.invalidateQueries({ queryKey: ["conversation-states"] });\n      qc.invalidateQueries({ queryKey: ["notifications"] });\n    });\n  }, [clientId, role, qc]);'''
          new = '''  // Mark read when the thread opens AND whenever a new message arrives while\n  // this thread is open. Previously the effect could fire before messages\n  // loaded, return early, and never retry until the conversation was reopened.\n  const latestMessageId = messages[messages.length - 1]?.id ?? null;\n  useEffect(() => {\n    if (!clientId || !latestMessageId) return;\n    let cancelled = false;\n    void markRead(clientId, role).then(() => {\n      if (cancelled) return;\n      qc.invalidateQueries({ queryKey: ["conversation-states"] });\n      qc.invalidateQueries({ queryKey: ["last-messages"] });\n      qc.invalidateQueries({ queryKey: ["admin-nav-badges"] });\n      qc.invalidateQueries({ queryKey: ["notifications"] });\n    });\n    return () => { cancelled = true; };\n  }, [clientId, role, qc, latestMessageId]);'''
          assert old in s, 'message-thread mark-read effect not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Admin inbox: keep enough message rows to compute real unread counts,
          # not just the single newest row per client. Make realtime invalidation
          # fast and accumulate keys instead of dropping events during debounce.
          p = Path('src/routes/_authenticated/admin/messages.tsx')
          s = p.read_text()
          s = s.replace(
            'import { MessageThread, UnreadBadge, PriorityChip } from "@/components/message-thread";',
            'import { MessageThread, PriorityChip } from "@/components/message-thread";',
            1,
          )
          old = '''      // Single bulk fetch instead of N+1 per-client queries. We pull the\n      // most-recent slice of messages across all relevant clients and\n      // take the first row per client_id client-side.'''
          new = '''      // Single bulk fetch instead of N+1 per-client queries. Keep the recent\n      // rows (not only one row per client) so unread counts and manual\n      // mark-unread stay correct even when the latest message was sent by us.'''
          assert old in s, 'last-messages comment not found'
          s = s.replace(old, new, 1)
          old = '''        .order("created_at", { ascending: false })\n        .limit(Math.max(500, clientIds.length * 2));\n      if (error) throw error;\n      const seen = new Set<string>();\n      const latest: Message[] = [];\n      for (const m of (data ?? []) as Message[]) {\n        if (seen.has(m.client_id)) continue;\n        seen.add(m.client_id);\n        latest.push(m);\n      }\n      return latest;'''
          new = '''        .order("created_at", { ascending: false })\n        .limit(Math.max(1000, clientIds.length * 20));\n      if (error) throw error;\n      return (data ?? []) as Message[];'''
          assert old in s, 'last-messages reduction block not found'
          s = s.replace(old, new, 1)
          old = '''  useEffect(() => {\n    let pending: ReturnType<typeof setTimeout> | null = null;\n    const scheduleInvalidate = (keys: string[]) => {\n      if (pending) return;\n      pending = setTimeout(() => {\n        pending = null;\n        for (const k of keys) qc.invalidateQueries({ queryKey: [k] });\n      }, 750);\n    };'''
          new = '''  useEffect(() => {\n    let pending: ReturnType<typeof setTimeout> | null = null;\n    const pendingKeys = new Set<string>();\n    const scheduleInvalidate = (keys: string[]) => {\n      for (const key of keys) pendingKeys.add(key);\n      if (pending) return;\n      pending = setTimeout(() => {\n        pending = null;\n        const keysToFlush = Array.from(pendingKeys);\n        pendingKeys.clear();\n        for (const k of keysToFlush) qc.invalidateQueries({ queryKey: [k] });\n      }, 75);\n    };'''
          assert old in s, 'inbox realtime debounce block not found'
          s = s.replace(old, new, 1)
          s = s.replace(
            'scheduleInvalidate(["last-messages", "conversation-states"]);',
            'scheduleInvalidate(["last-messages", "conversation-states", "admin-nav-badges"]);',
            1,
          )
          s = s.replace(
            'scheduleInvalidate(["conversation-states"]);',
            'scheduleInvalidate(["conversation-states", "admin-nav-badges"]);',
            1,
          )
          old = '''                  <span className={cn("truncate flex-1 text-xs", unread > 0 || liftReview ? "text-foreground" : "text-muted-foreground")}>'''
          new = '''                  <span className={cn("truncate flex-1 text-xs", unread > 0 ? "font-semibold text-foreground" : liftReview ? "text-foreground" : "text-muted-foreground")}>'''
          assert old in s, 'preview unread style not found'
          s = s.replace(old, new, 1)
          old = '''                  <UnreadBadge count={unread} />'''
          new = '''                  {unread > 0 && (\n                    <span\n                      className="h-2.5 w-2.5 shrink-0 rounded-full bg-[#007AFF]"\n                      aria-label={`${unread} unread message${unread === 1 ? "" : "s"}`}\n                      title={`${unread} unread`}\n                    />\n                  )}'''
          assert old in s, 'UnreadBadge row marker not found'
          s = s.replace(old, new, 1)
          old = '''                    <span className="shrink-0 text-[10px] text-muted-foreground">'''
          new = '''                    <span className={cn("shrink-0 text-[10px]", unread > 0 ? "font-semibold text-[#007AFF]" : "text-muted-foreground")}>'''
          assert old in s, 'row timestamp style not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Bottom/side nav badge must count unread conversations, not merely
          # conversations whose newest message happens to be from the client.
          p = Path('src/hooks/use-admin-nav-badges.ts')
          s = p.read_text()
          old = '''        (supabase.from("messages") as any)\n          .select("client_id, sender_role, created_at")\n          .eq("is_internal_note", false)\n          .in("delivery_status", ["sent", "sending"])\n          .order("created_at", { ascending: false })\n          .limit(2000),'''
          new = '''        (supabase.from("messages") as any)\n          .select("client_id")\n          .eq("sender_role", "client")\n          .is("read_by_admin_at", null)\n          .eq("is_internal_note", false)\n          .in("delivery_status", ["sent", "sending"]),'''
          assert old in s, 'nav unread query not found'
          s = s.replace(old, new, 1)
          old = '''        messages: (() => {\n          const seen = new Set<string>();\n          let count = 0;\n          for (const row of clientMessages.data ?? []) {\n            if (seen.has(row.client_id)) continue;\n            seen.add(row.client_id);\n            if (row.sender_role === "client") count += 1;\n          }\n          return count;\n        })(),'''
          new = '''        messages: new Set((clientMessages.data ?? []).map((row: any) => row.client_id)).size,'''
          assert old in s, 'nav unread count block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify production build
        run: npm install --legacy-peer-deps && npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/fix-message-unread-live.yml
          git config user.name 'JF Effect automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/message-thread.tsx src/routes/_authenticated/admin/messages.tsx src/hooks/use-admin-nav-badges.ts .github/workflows/fix-message-unread-live.yml
          git commit -m 'Make message unread state live and iPhone-style'
          git push origin main
