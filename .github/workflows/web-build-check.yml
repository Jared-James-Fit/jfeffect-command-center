name: Web Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build production web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exercise unit sync fix
        run: |
          python .github/scripts/apply_exercise_unit_sync.py
          if ! git diff --quiet -- src/components/workout-day/WorkoutDayView.tsx; then
            git config user.name "JF Effect Automation"
            git config user.email "actions@users.noreply.github.com"
            git add src/components/workout-day/WorkoutDayView.tsx
            git commit -m "Sync workout unit preference by exercise"
            git push origin HEAD:main
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production app
        run: npm run build
