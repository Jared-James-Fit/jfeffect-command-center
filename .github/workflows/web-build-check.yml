name: Web Build Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-web:
    name: Build production web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # vitest's own exit code is ignored here: main has known failures
      # (scripts/known-test-failures.json). The next step fails the job on
      # any failure that isn't on that list.
      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json || true

      - name: Fail on new test failures
        run: node scripts/check-test-failures.mjs vitest-results.json

      - name: Security gate
        run: npm run security:gate

      - name: Build production app
        run: npm run build

      # Verification branch only: does the committed route tree match the generator?
      - name: Route tree diff
        if: always()
        run: |
          git diff --stat src/routeTree.gen.ts
          git diff -U0 --no-color src/routeTree.gen.ts | head -60
