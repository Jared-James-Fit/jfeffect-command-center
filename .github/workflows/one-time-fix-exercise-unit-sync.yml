name: One-time exercise unit sync fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-exercise-unit-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time exercise unit sync patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make exercise units canonical per exercise
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/workout-day/WorkoutDayView.tsx')
          text = path.read_text()

          replacements = [
              (
                  '() => Array.from(new Set((rows as any[]).map((r) => r.exercises?.id).filter(Boolean) as string[])),',
                  '() => Array.from(new Set((rows as any[]).map((r) => r.exercises?.id ?? r.exercise_id).filter(Boolean) as string[])),'
              ),
              (
                  '      const exId = r.exercises?.id;\n      const rowKey = `row:${r.id}`;\n      // Per-row override only — two cards with the same exerciseId (e.g.\n      // a primary + secondary backoff of the same lift) must toggle\n      // independently. The persisted client/member preference (saved by\n      // exerciseId) still seeds future workouts via resolveExerciseUnit.\n      const local = unitOverrides[rowKey];',
                  '      const exId = r.exercises?.id ?? r.exercise_id ?? null;\n      const rowKey = `row:${r.id}`;\n      // Unit choice belongs to the canonical exercise, not the program row.\n      // A top set + backoff (or any repeated card) for the same exercise must\n      // switch together immediately. Rows without a canonical exercise id keep\n      // a row-scoped fallback so unrelated name-only exercises never collide.\n      const preferenceKey = exId ? `exercise:${exId}` : rowKey;\n      const local = unitOverrides[preferenceKey];'
              ),
              (
                  'onUnitChange={(u) => setExerciseUnit(r.exercises?.id ?? null, r.id, u)}',
                  'onUnitChange={(u) => setExerciseUnit(r.exercises?.id ?? r.exercise_id ?? null, r.id, u)}'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected patch target not found: {old[:120]}')
              text = text.replace(old, new)

          pattern = re.compile(
              r'  const setExerciseUnit = async \(exerciseId: string \| null, rowId: string, next: WUnit\) => \{.*?\n  \};\n\n  const unitForRow',
              re.S,
          )
          replacement = '''  const setExerciseUnit = async (exerciseId: string | null, rowId: string, next: WUnit) => {
    const rowKey = `row:${rowId}`;
    const key = exerciseId ? `exercise:${exerciseId}` : rowKey;
    const previousOverride = unitOverrides[key];
    const prevUnit = resolvedUnitMap[rowKey] ?? unit;

    // Optimistic exercise-level override: every visible card sharing the same
    // canonical exercise id updates in the same render.
    setUnitOverrides((m) => ({ ...m, [key]: next }));

    if (client?.id && exerciseId) {
      try {
        if (adapter) {
          await adapter.saveExerciseUnitPref({ exerciseId, unit: next });
        } else {
          await saveExerciseUnitPref(client.id, exerciseId, next);
        }
      } catch (error) {
        // Never pretend a preference saved. Restore the previous local state
        // and surface the failure so a refresh cannot surprise the athlete.
        setUnitOverrides((m) => {
          const copy = { ...m };
          if (previousOverride === "kg" || previousOverride === "lb") copy[key] = previousOverride;
          else delete copy[key];
          return copy;
        });
        toast.error("Could not save the exercise unit — try again");
        return;
      }
      await qc.invalidateQueries({ queryKey: ["client-exercise-unit-prefs"] });
    }

    undo.push({
      label: `Set exercise unit to ${next.toUpperCase()}`,
      coalesceKey: `ex-unit:${key}`,
      undo: async () => {
        setUnitOverrides((m) => ({ ...m, [key]: prevUnit }));
        if (client?.id && exerciseId) {
          try {
            if (adapter) {
              await adapter.saveExerciseUnitPref({ exerciseId, unit: prevUnit });
            } else {
              await saveExerciseUnitPref(client.id, exerciseId, prevUnit);
            }
            await qc.invalidateQueries({ queryKey: ["client-exercise-unit-prefs"] });
          } catch {
            toast.error("Could not restore the previous exercise unit");
          }
        }
      },
    });
  };

  const unitForRow'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one setExerciseUnit block; patched {count}')

          path.write_text(text)
      - name: Verify patch
        run: |
          grep -q 'const preferenceKey = exId ? `exercise:${exId}` : rowKey;' src/components/workout-day/WorkoutDayView.tsx
          grep -q 'r.exercises?.id ?? r.exercise_id ?? null' src/components/workout-day/WorkoutDayView.tsx
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "JF Effect Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/workout-day/WorkoutDayView.tsx
          git commit -m "Sync workout unit preference by exercise"
          git push origin HEAD:main
