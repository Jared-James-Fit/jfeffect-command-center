name: iOS Build and Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build and Upload iOS to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Setup Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods gem
        run: gem install cocoapods --no-document

      - name: Setup iOS platform
        run: |
          rm -rf ios
          npx cap add ios
          cat > ios/App/Podfile << 'PODFILE'
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '16.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end
          PODFILE
          echo "✅ Podfile written"

      - name: Run pod install
        run: cd ios/App && pod install

      - name: Set up App Store Connect API key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Get Apple Developer Team ID
        id: team
        run: |
          TEAM_ID=$(xcrun altool --list-providers \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            2>/dev/null | grep -E "^[A-Z0-9]{10}" | head -1 | awk '{print $1}' || echo "")
          
          if [ -z "$TEAM_ID" ]; then
            # Try alternative: get from App Store Connect API
            TEAM_ID=$(curl -s "https://api.appstoreconnect.apple.com/v1/apps/6781493556" \
              -H "Authorization: Bearer $(python3 -c "
          import jwt, time
          key = open('$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8').read()
          payload = {'iss': '${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}', 'iat': int(time.time()), 'exp': int(time.time())+600, 'aud': 'appstoreconnect-v1'}
          print(jwt.encode(payload, key, algorithm='ES256', headers={'kid': '${{ secrets.APP_STORE_CONNECT_KEY_ID }}'}))
          " 2>/dev/null)" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('relationships',{}).get('gameCenterEnabledVersions',{}).get('data',''))" 2>/dev/null || echo "")
          fi
          
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_OUTPUT
          echo "Team ID: $TEAM_ID"

      - name: Update bundle identifier in Xcode project
        run: |
          find ios -name "*.pbxproj" -exec sed -i '' 's/com\.jaredjamesfit\.jfeffect/com.jfeffect.app/g' {} \; || true
          find ios -name "*.pbxproj" -exec sed -i '' 's/com\.capacitorjs\.app/com.jfeffect.app/g' {} \; || true

      - name: Build and Archive iOS app
        run: |
          cd ios/App
          TEAM_ID="${{ steps.team.outputs.TEAM_ID }}"
          
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/JFEffect.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=com.jfeffect.app \
            ALLOW_PROVISIONING_UPDATES=YES \
            ${TEAM_ID:+DEVELOPMENT_TEAM=$TEAM_ID} \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Export and Upload to TestFlight
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/JFEffect.xcarchive" \
            -exportPath "$RUNNER_TEMP/JFEffect-export" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload archive as artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JFEffect-xcarchive
          path: ${{ runner.temp }}/JFEffect.xcarchive
          retention-days: 7
