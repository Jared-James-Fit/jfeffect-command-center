name: iOS Build and Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build and Upload iOS to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add iOS platform if not present
        run: |
          if [ ! -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists"
          fi

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          cd ios/App && pod install

      - name: Set up App Store Connect API key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Update bundle identifier in Xcode project
        run: |
          cd ios/App
          # Update bundle ID to com.jfeffect.app
          sed -i '' 's/com\.jaredjamesfit\.jfeffect/com.jfeffect.app/g' App.xcodeproj/project.pbxproj || true
          # Also try the workspace
          find . -name "*.pbxproj" -exec sed -i '' 's/com\.jaredjamesfit\.jfeffect/com.jfeffect.app/g' {} \; || true

      - name: Build and Archive iOS app
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/JFEffect.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$(xcrun altool --list-providers -u "" --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} 2>/dev/null | grep "Provider" | head -1 | awk '{print $NF}' || echo "") \
            PRODUCT_BUNDLE_IDENTIFIER=com.jfeffect.app \
            | xcpretty || true
          
          # Try without xcpretty if it fails
          if [ ! -d "$RUNNER_TEMP/JFEffect.xcarchive" ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath $RUNNER_TEMP/JFEffect.xcarchive \
              archive \
              CODE_SIGN_STYLE=Automatic \
              PRODUCT_BUNDLE_IDENTIFIER=com.jfeffect.app \
              ALLOW_PROVISIONING_UPDATES=YES
          fi

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | awk '{print $3}' | tr -d '()')</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/JFEffect.xcarchive \
            -exportPath $RUNNER_TEMP/JFEffect-export \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        run: |
          xcrun altool \
            --upload-package "$RUNNER_TEMP/JFEffect-export/JF Effect.ipa" \
            --type ios \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            --verbose || \
          xcrun altool \
            --upload-app \
            --file "$RUNNER_TEMP/JFEffect-export/App.ipa" \
            --type ios \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            --verbose

      - name: Upload archive as artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JFEffect-xcarchive
          path: ${{ runner.temp }}/JFEffect.xcarchive
          retention-days: 7
