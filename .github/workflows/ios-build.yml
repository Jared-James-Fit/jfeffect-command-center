name: iOS Build and Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build and Upload iOS to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          # Find and select the latest Xcode 26.x version
          XCODE_26=$(ls /Applications/ | grep -E "^Xcode_26\." | sort -V | tail -1)
          echo "Found Xcode 26 versions:"
          ls /Applications/ | grep -E "^Xcode_26" || echo "None found"
          
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "/Applications/$XCODE_26"
            echo "✅ Selected $XCODE_26"
          else
            echo "⚠️ No Xcode 26.x found, trying Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== iOS SDK version ==="
          xcrun --sdk iphoneos --show-sdk-version


      - name: Set build number and version
        run: |
          # Use GitHub run number as build number (increments automatically)
          BUILD_NUMBER=${{ github.run_number }}
          echo "Build number: $BUILD_NUMBER"
          
          # Get version from package.json
          VERSION=$(node -e "const p=require('./package.json'); console.log(p.version || '1.0.0')")
          echo "Version: $VERSION"
          
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Setup Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods gem
        run: gem install cocoapods --no-document

      - name: Setup iOS platform
        run: |
          rm -rf ios
          npx cap add ios
          cat > ios/App/Podfile << 'PODFILE'
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'
          platform :ios, '16.0'
          use_frameworks!
          install! 'cocoapods', :disable_input_output_paths => true
          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end
          target 'App' do
            capacitor_pods
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          PODFILE
          echo "✅ Podfile written with post_install hook"
          
          # Create placeholder web assets that Capacitor expects
          mkdir -p ios/App/App/public
          cat > ios/App/App/public/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>JF Effect</title>
          <script>window.location.href = "https://jfeffect.com";</script>
          </head><body></body></html>
          HTML
          
          # Create config.xml if it doesn't exist
          if [ ! -f ios/App/App/config.xml ]; then
            cat > ios/App/App/config.xml << 'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.jfeffect.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>JF Effect</name>
            <content src="index.html" />
          </widget>
          XML
          fi
          
          # Create capacitor.config.json if it doesn't exist
          if [ ! -f ios/App/App/capacitor.config.json ]; then
            cat > ios/App/App/capacitor.config.json << 'JSON'
          {
            "appId": "com.jfeffect.app",
            "appName": "JF Effect",
            "webDir": "public",
            "server": {
              "url": "https://jfeffect.com",
              "cleartext": false
            }
          }
          JSON
          fi
          
          echo "✅ All placeholder web assets created"


      - name: Patch Info.plist for encryption compliance
        run: |
          # Add ITSAppUsesNonExemptEncryption=false to avoid App Store compliance questions
          INFOPLIST="ios/App/App/Info.plist"
          if [ -f "$INFOPLIST" ]; then
            # Check if key already exists
            if ! grep -q "ITSAppUsesNonExemptEncryption" "$INFOPLIST"; then
              # Add before closing </dict>
              sed -i '' 's|</dict>|\t<key>ITSAppUsesNonExemptEncryption</key>\n\t<false/>\n</dict>|' "$INFOPLIST"
              echo "✅ Added ITSAppUsesNonExemptEncryption=false to Info.plist"
            else
              echo "ℹ️ ITSAppUsesNonExemptEncryption already set"
            fi
          else
            echo "⚠️ Info.plist not found at $INFOPLIST"
          fi

      - name: Set AppIcon
        run: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          # Generate all required icon sizes from the 1024x1024 source
          python3 << 'PYEOF'
          from PIL import Image
          import json, os
          src = "AppIcon-1024.png"
          iconset = "ios/App/App/Assets.xcassets/AppIcon.appiconset"
          sizes = [
            (20, "iphone", "1x"), (40, "iphone", "2x"), (60, "iphone", "3x"),
            (29, "iphone", "1x"), (58, "iphone", "2x"), (87, "iphone", "3x"),
            (40, "iphone", "2x"), (80, "iphone", "2x"), (120, "iphone", "2x"), (120, "iphone", "3x"),
            (180, "iphone", "3x"),
            (20, "ipad", "1x"), (20, "ipad", "2x"),
            (29, "ipad", "1x"), (58, "ipad", "2x"),
            (40, "ipad", "1x"), (80, "ipad", "2x"),
            (76, "ipad", "1x"), (152, "ipad", "2x"),
            (167, "ipad", "2x"),
            (1024, "ios-marketing", "1x"),
          ]
          img = Image.open(src).convert("RGB")
          images = []
          seen = set()
          for px, idiom, scale in sizes:
            key = (px, idiom, scale)
            if key in seen: continue
            seen.add(key)
            fname = f"AppIcon-{px}@{scale}.png"
            resized = img.resize((px, px), Image.LANCZOS)
            resized.save(os.path.join(iconset, fname), "PNG")
            base = px // int(scale[0])
            images.append({"filename": fname, "idiom": idiom, "scale": scale, "size": f"{base}x{base}"})
          contents = {"images": images, "info": {"author": "xcode", "version": 1}}
          with open(os.path.join(iconset, "Contents.json"), "w") as f:
            json.dump(contents, f, indent=2)
          print(f"✅ Generated {len(images)} icon sizes")
          PYEOF
          echo "✅ AppIcon set: $(ls $ICONSET | wc -l) files"

      - name: Run pod install
        run: cd ios/App && pod install

      - name: Install Distribution Certificate and Provisioning Profile
        run: |
          # Decode and install the distribution certificate
          echo "${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}" | base64 --decode > /tmp/distribution.p12
          
          # Decode provisioning profile
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/JFEffect_AppStore.mobileprovision
          
          echo "P12 file size: $(wc -c < /tmp/distribution.p12) bytes"
          
          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="build_keychain_pwd_$(date +%s)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          security import /tmp/distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild \
            -f pkcs12
          
          # Allow codesign to access the keychain
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(python3 -c "
          import subprocess, plistlib
          result = subprocess.run(['security', 'cms', '-D', '-i', '/tmp/JFEffect_AppStore.mobileprovision'], capture_output=True)
          plist = plistlib.loads(result.stdout)
          print(plist['UUID'])
          ")
          echo "Profile UUID: $PROFILE_UUID"
          cp /tmp/JFEffect_AppStore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          
          # Verify certificate is accessible
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          
          echo "✅ Certificate and profile installed"

      - name: Set up App Store Connect API key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Patch pbxproj for manual signing
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          
          python3 << 'PYEOF'
          import re

          path = "ios/App/App.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()

          # Fix bundle ID
          content = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;', 'PRODUCT_BUNDLE_IDENTIFIER = com.jfeffect.app;', content)

          # Set development team
          content = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]*;', 'DEVELOPMENT_TEAM = 92T56MN5FL;', content)

          with open(path, "w") as f:
              f.write(content)

          print("✅ pbxproj patched successfully")
          PYEOF

      - name: Build and Archive iOS app
        run: |
          # Get the signing identity from keychain
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | head -1 | awk -F'"' '{print $2}')
          echo "Using signing identity: $SIGNING_IDENTITY"
          
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: No Apple Distribution signing identity found!"
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi
          
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/JFEffect.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER=com.jfeffect.app \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            MARKETING_VERSION=$APP_VERSION \
            PROVISIONING_PROFILE_SPECIFIER="JF Effect App Store Distribution" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN_PATH"

      - name: Export and Upload to TestFlight
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.jfeffect.app</key>
              <string>JF Effect App Store Distribution</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/JFEffect.xcarchive" \
            -exportPath "$RUNNER_TEMP/JFEffect-export" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload archive as artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JFEffect-xcarchive
          path: ${{ runner.temp }}/JFEffect.xcarchive
          retention-days: 7
