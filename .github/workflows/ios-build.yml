name: iOS Build and Upload

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight (off = build and check only)
        type: boolean
        default: true

jobs:
  build-ios:
    name: Build and Upload iOS to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          # Find and select the latest Xcode 26.x version
          XCODE_26=$(ls /Applications/ | grep -E "^Xcode_26\." | sort -V | tail -1)
          echo "Found Xcode 26 versions:"
          ls /Applications/ | grep -E "^Xcode_26" || echo "None found"
          
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "/Applications/$XCODE_26"
            echo "✅ Selected $XCODE_26"
          else
            echo "⚠️ No Xcode 26.x found, trying Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== iOS SDK version ==="
          xcrun --sdk iphoneos --show-sdk-version


      - name: Set build number and version
        run: |
          # Use GitHub run number as build number (increments automatically)
          BUILD_NUMBER=${{ github.run_number }}
          echo "Build number: $BUILD_NUMBER"
          
          # Get version from package.json
          VERSION=$(node -e "const p=require('./package.json'); console.log(p.version || '1.0.0')")
          echo "Version: $VERSION"
          
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Setup Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods gem
        run: gem install cocoapods --no-document

      - name: Setup iOS platform
        run: |
          rm -rf ios
          npx cap add ios
          # Disable iOS shake-to-undo ("Undo Typing" popups mid-workout).
          APPDELEGATE=ios/App/App/AppDelegate.swift
          perl -0pi -e 's/(didFinishLaunchingWithOptions[^{]*\{)/$1\n        application.applicationSupportsShakeToEdit = false/' "$APPDELEGATE"
          if grep -q "applicationSupportsShakeToEdit = false" "$APPDELEGATE"; then
            echo "✅ Shake-to-undo disabled"
          else
            echo "::warning::Could not disable shake-to-undo in AppDelegate.swift"
          fi
          # iOS 26 blurs the web view's content under the status bar and behind the
          # floating tab bar (UIKit's scroll edge effect); the page draws its own
          # bars, so the effect is turned off. Built with Xcode 26 only, iOS 26+ only.
          perl -0pi -e 's/(func applicationDidBecomeActive\(_ application: UIApplication\) \{)/$1\n        #if compiler(>=6.2)\n        if #available(iOS 26.0, *), let scrollView = (window?.rootViewController as? CAPBridgeViewController)?.webView?.scrollView {\n            scrollView.topEdgeEffect.isHidden = true\n            scrollView.bottomEdgeEffect.isHidden = true\n        }\n        #endif/' "$APPDELEGATE"
          if grep -q "topEdgeEffect.isHidden = true" "$APPDELEGATE"; then
            echo "✅ iOS 26 scroll edge effect off"
          else
            echo "::warning::Could not turn off the iOS 26 scroll edge effect in AppDelegate.swift"
          fi
          cat > ios/App/Podfile << 'PODFILE'
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'
          platform :ios, '16.0'
          use_frameworks!
          install! 'cocoapods', :disable_input_output_paths => true
          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
            pod 'JfPhotos', :path => '../../native/jf-photos'
          end
          target 'App' do
            capacitor_pods
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          PODFILE
          echo "✅ Podfile written with post_install hook"
          
          # Create placeholder web assets that Capacitor expects
          mkdir -p ios/App/App/public
          cat > ios/App/App/public/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>JF Effect</title>
          <script>window.location.href = "https://jfeffect.com";</script>
          </head><body></body></html>
          HTML
          
          # Create config.xml if it doesn't exist
          if [ ! -f ios/App/App/config.xml ]; then
            cat > ios/App/App/config.xml << 'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.jfeffect.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>JF Effect</name>
            <content src="index.html" />
          </widget>
          XML
          fi
          
          # Create capacitor.config.json if it doesn't exist
          if [ ! -f ios/App/App/capacitor.config.json ]; then
            cat > ios/App/App/capacitor.config.json << 'JSON'
          {
            "appId": "com.jfeffect.app",
            "appName": "JF Effect",
            "webDir": "public",
            "server": {
              "url": "https://jfeffect.com",
              "cleartext": false
            }
          }
          JSON
          fi
          
          echo "✅ All placeholder web assets created"


      # ── App privacy manifest (always) ───────────────────────────────────────
      # Apple requires a PrivacyInfo.xcprivacy in the app at upload. `cap add ios`
      # regenerates the project without one (and `rm -rf ios` above deletes
      # anything kept under ios/), so the committed native/ios-app copy is put in
      # the App folder and added to the App target's Resources here, every build,
      # with the xcodeproj gem CocoaPods brought in. Checked in the built app below.
      - name: Add the app privacy manifest
        run: |
          cp native/ios-app/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" } or abort("App target not found")
            group = project.main_group.children.find { |g| g.respond_to?(:path) && g.path == "App" } or abort("App group not found")
            ref = group.files.find { |f| f.path == "PrivacyInfo.xcprivacy" } || group.new_reference("PrivacyInfo.xcprivacy")
            unless target.resources_build_phase.files_references.include?(ref)
              target.resources_build_phase.add_file_reference(ref, true)
            end
            project.save
            puts "✅ PrivacyInfo.xcprivacy in the App target resources"
          '

      - name: Patch Info.plist for encryption compliance
        run: |
          # Add ITSAppUsesNonExemptEncryption=false to avoid App Store compliance questions
          INFOPLIST="ios/App/App/Info.plist"
          if [ -f "$INFOPLIST" ]; then
            # Check if key already exists
            if ! grep -q "ITSAppUsesNonExemptEncryption" "$INFOPLIST"; then
              # Add before closing </dict>
              sed -i '' 's|</dict>|\t<key>ITSAppUsesNonExemptEncryption</key>\n\t<false/>\n</dict>|' "$INFOPLIST"
              echo "✅ Added ITSAppUsesNonExemptEncryption=false to Info.plist"
            else
              echo "ℹ️ ITSAppUsesNonExemptEncryption already set"
            fi
          else
            echo "⚠️ Info.plist not found at $INFOPLIST"
          fi

      # ── Privacy purpose strings (always) ────────────────────────────────────
      # iOS kills the app outright (it looks like a crash) the moment the web page
      # opens the camera, microphone or photo library without these. `cap add ios`
      # regenerates Info.plist every build, so they're set here on every build,
      # not inside an optional step. With them, iOS shows its own "Allow" popup
      # the first time each is needed and remembers the answer (Capacitor grants
      # the page's request itself, so there's no second website prompt).
      - name: Set camera, microphone and photo purpose strings
        run: |
          python3 << 'PYEOF'
          import plistlib
          info = "ios/App/App/Info.plist"
          with open(info, "rb") as f:
              pl = plistlib.load(f)
          strings = {
              "NSCameraUsageDescription": "JF Effect uses the camera when you take a photo or video for a post, record a lift video, take a progress photo or set your profile picture.",
              "NSMicrophoneUsageDescription": "JF Effect uses the microphone when you talk to Cleo, record a voice note or record a video with sound.",
              "NSPhotoLibraryUsageDescription": "JF Effect shows your photos and videos when you make a post, so you can pick what to share, and opens the ones you choose to send in a message or use as your profile picture.",
              "NSPhotoLibraryAddUsageDescription": "JF Effect saves photos and share cards to your library when you tap Save.",
          }
          pl.update(strings)
          # with "Limit access", iOS would ask to select more photos on every launch; the
          # New post screen has its own Manage instead (Instagram does the same)
          pl["PHPhotoLibraryPreventAutomaticLimitedAccessAlert"] = True
          with open(info, "wb") as f:
              plistlib.dump(pl, f)
          with open(info, "rb") as f:
              check = plistlib.load(f)
          missing = [k for k in strings if not check.get(k)]
          assert not missing, f"purpose strings missing: {missing}"
          print("✅ Purpose strings set: " + ", ".join(strings))
          PYEOF

      # ── Portrait only on iPhone (TikTok's, Instagram's) ──────────────────────
      # `cap add ios` regenerates Info.plist every build, so it's set here every
      # build. iPads keep every orientation (their own key, left as it is).
      - name: Keep the iPhone app upright
        run: |
          python3 << 'PYEOF'
          import plistlib
          info = "ios/App/App/Info.plist"
          with open(info, "rb") as f:
              pl = plistlib.load(f)
          pl["UISupportedInterfaceOrientations"] = ["UIInterfaceOrientationPortrait"]
          with open(info, "wb") as f:
              plistlib.dump(pl, f)
          with open(info, "rb") as f:
              check = plistlib.load(f)
          assert check["UISupportedInterfaceOrientations"] == ["UIInterfaceOrientationPortrait"], "orientation not set"
          print("✅ iPhone: portrait only; iPad:", check.get("UISupportedInterfaceOrientations~ipad"))
          PYEOF

      # The web app can tell which iPhone build it's running in (e.g. to say
      # "update the app" when a build is too old for the camera): Capacitor
      # appends this to the web view's user agent. The App plugin isn't linked.
      # Plus the plugins the app links itself. `cap add ios`'s own sync never runs here
      # (no dist folder: the app loads jfeffect.com), so Capacitor never writes the
      # plugin list; the bridge registers only the classes named in it. JfPhotosPlugin
      # is native/jf-photos, linked by the Podfile above: New post's camera roll
      # (src/lib/native-photos.ts).
      - name: Stamp the build number on the web view
        run: |
          python3 << 'PYEOF'
          import json, os
          path = "ios/App/App/capacitor.config.json"
          cfg = json.load(open(path))
          cfg["appendUserAgent"] = f"JFEffectApp/{os.environ['BUILD_NUMBER']}"
          cfg["packageClassList"] = sorted(set(cfg.get("packageClassList") or []) | {"JfPhotosPlugin"})
          json.dump(cfg, open(path, "w"), indent=2)
          print("✅ User agent stamp:", cfg["appendUserAgent"])
          print("✅ Plugins the app registers:", cfg["packageClassList"])
          PYEOF

      - name: Install Pillow for the icon and launch image
        run: python3 -m pip install --break-system-packages Pillow

      # ── App icon and launch image (always) ──────────────────────────────────
      # `cap add ios` above regenerates the Xcode project from Capacitor's template,
      # which carries Capacitor's own placeholder icon and launch image (the
      # Capacitor logo). App Review rejected build 35 for placeholder icons
      # (guideline 2.3.8), so both sets are wiped and rebuilt from AppIcon-1024.png
      # every build (every iPhone and iPad size, the 1024 App Store icon with no
      # alpha channel, the launch image on the app's dark background), then checked
      # against Capacitor's placeholders: the build fails if any is left.
      # native/ios-app/app_art.py.
      - name: Set the app icon and launch image
        run: |
          python3 native/ios-app/app_art.py generate AppIcon-1024.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset \
            ios/App/App/Assets.xcassets/Splash.imageset

      - name: Check the app icon and launch image aren't placeholders
        run: |
          python3 native/ios-app/app_art.py check AppIcon-1024.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset \
            ios/App/App/Assets.xcassets/Splash.imageset \
            node_modules/@capacitor/cli/assets/ios-pods-template.tar.gz
          grep -q "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;" ios/App/App.xcodeproj/project.pbxproj \
            || { echo "::error::The App target doesn't use the AppIcon set"; exit 1; }

      # ── iPhone only, unless IOS_SUPPORT_IPAD is "true" ───────────────────────
      # Capacitor's template builds for iPhone and iPad (TARGETED_DEVICE_FAMILY "1,2"),
      # so App Review tested build 35 on an iPad. The app is laid out for a phone;
      # until every main flow is tested on an iPad (and 13-inch screenshots exist),
      # the App target is iPhone only (an iPad still runs it in iPhone compatibility
      # mode). Set the repository variable IOS_SUPPORT_IPAD to "true" to build for
      # iPad again. docs/APPLE_IAP_DECISION.md (iPad).
      - name: Set the device family (iPhone only by default)
        env:
          IOS_SUPPORT_IPAD: ${{ vars.IOS_SUPPORT_IPAD || 'false' }}
        run: |
          python3 << 'PYEOF'
          import os, re
          path = "ios/App/App.xcodeproj/project.pbxproj"
          c = open(path).read()
          family = '"1,2"' if os.environ.get("IOS_SUPPORT_IPAD", "false").lower() == "true" else "1"
          c, n = re.subn(r"TARGETED_DEVICE_FAMILY = [^;]+;", f"TARGETED_DEVICE_FAMILY = {family};", c)
          assert n >= 2, f"TARGETED_DEVICE_FAMILY found {n} times (expected the App target's Debug and Release)"
          open(path, "w").write(c)
          print(f"✅ TARGETED_DEVICE_FAMILY = {family} ({'iPhone and iPad' if family != '1' else 'iPhone only'}) on {n} configurations")
          PYEOF

      # ── Apple Health (HealthKit) ────────────────────────────────────────────
      # OFF unless the repo variable ENABLE_HEALTHKIT is "true". Turn it on only after
      # the App ID has the HealthKit capability AND the "JF Effect App Store Distribution"
      # profile was regenerated and re-uploaded to PROVISIONING_PROFILE_BASE64; otherwise
      # signing fails. With it off, this build is identical to before.
      - name: Enable HealthKit (Apple Health sync)
        if: ${{ vars.ENABLE_HEALTHKIT == 'true' }}
        run: |
          python3 << 'PYEOF'
          import re, plistlib
          # 1. Link the health plugin. This workflow's Podfile lists pods explicitly,
          #    so plugins are only linked when added here.
          podfile = "ios/App/Podfile"
          s = open(podfile).read()
          line = "pod 'CapgoCapacitorHealth', :path => '../../node_modules/@capgo/capacitor-health'"
          if line not in s:
              s, n = re.subn(r"^(\s*)(pod 'CapacitorCordova'.*)$", lambda m: f"{m.group(1)}{m.group(2)}\n{m.group(1)}{line}", s, count=1, flags=re.M)
              assert n == 1, "CapacitorCordova pod line not found"
          open(podfile, "w").write(s)

          # 2. Purpose strings Apple requires for HealthKit.
          info = "ios/App/App/Info.plist"
          with open(info, "rb") as f:
              pl = plistlib.load(f)
          pl["NSHealthShareUsageDescription"] = "JF Effect reads your sleep, heart rate, HRV, steps and active energy so your coach can program around your recovery."
          # The app only reads; the health library links Apple Health's write calls, so the key must exist.
          pl["NSHealthUpdateUsageDescription"] = "JF Effect doesn't save anything to Apple Health. It only reads the sleep, heart rate, HRV, steps and active energy you choose to share, so your coach can plan around your recovery."
          # (camera / microphone / photos are set for every build in their own step)
          with open(info, "wb") as f:
              plistlib.dump(pl, f)

          # 3. HealthKit entitlement on the App target only.
          ent = {"com.apple.developer.healthkit": True, "com.apple.developer.healthkit.access": []}
          with open("ios/App/App/App.entitlements", "wb") as f:
              plistlib.dump(ent, f)
          pbx = "ios/App/App.xcodeproj/project.pbxproj"
          c = open(pbx).read()
          c, n = re.subn(r"(INFOPLIST_FILE = App/Info\.plist;)", r"CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\t\1", c)
          assert n >= 1, "App target build settings not found"
          open(pbx, "w").write(c)
          print(f"✅ HealthKit enabled (pod linked, purpose strings, entitlement on {n} configs)")
          PYEOF
          grep -n "CapgoCapacitorHealth" ios/App/Podfile

      - name: Run pod install
        run: cd ios/App && pod install

      - name: Install Distribution Certificate and Provisioning Profile
        run: |
          # Decode and install the distribution certificate
          echo "${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}" | base64 --decode > /tmp/distribution.p12
          
          # Decode provisioning profile
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/JFEffect_AppStore.mobileprovision
          
          echo "P12 file size: $(wc -c < /tmp/distribution.p12) bytes"
          
          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="build_keychain_pwd_$(date +%s)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          security import /tmp/distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild \
            -f pkcs12
          
          # Allow codesign to access the keychain
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(python3 -c "
          import subprocess, plistlib
          result = subprocess.run(['security', 'cms', '-D', '-i', '/tmp/JFEffect_AppStore.mobileprovision'], capture_output=True)
          plist = plistlib.loads(result.stdout)
          print(plist['UUID'])
          ")
          echo "Profile UUID: $PROFILE_UUID"
          cp /tmp/JFEffect_AppStore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          
          # Verify certificate is accessible
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          
          echo "✅ Certificate and profile installed"

      - name: Check provisioning profile allows HealthKit
        if: ${{ vars.ENABLE_HEALTHKIT == 'true' }}
        run: |
          python3 << 'PYEOF'
          import subprocess, plistlib, sys
          raw = subprocess.run(["security", "cms", "-D", "-i", "/tmp/JFEffect_AppStore.mobileprovision"], capture_output=True).stdout
          ent = plistlib.loads(raw).get("Entitlements", {})
          if not ent.get("com.apple.developer.healthkit"):
              print("::error::ENABLE_HEALTHKIT is on, but the provisioning profile has no HealthKit entitlement. "
                    "Enable HealthKit on the com.jfeffect.app App ID, regenerate 'JF Effect App Store Distribution', "
                    "and update the PROVISIONING_PROFILE_BASE64 secret (or set ENABLE_HEALTHKIT to false).")
              sys.exit(1)
          print("✅ Provisioning profile includes HealthKit")
          PYEOF

      - name: Set up App Store Connect API key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # ── Signing on the App target only ──────────────────────────────────────
      # Bundle id, team, manual signing and the profile are set on the App target's
      # Release configuration here, NOT as global xcodebuild arguments: a global
      # setting applies to every target in the workspace, so the pod frameworks
      # (Capacitor, CapacitorCordova, JfPhotos) and their resource bundles were all
      # built as com.jfeffect.app, and the export then tried to give the app's
      # profile to JfPhotos.framework ("does not support provisioning profiles").
      # Pods stay unsigned (Podfile post_install); the export signs them when embedded.
      - name: Patch pbxproj for manual signing
        run: |
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | head -1 | awk -F'"' '{print $2}')
          echo "Using signing identity: $SIGNING_IDENTITY"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: No Apple Distribution signing identity found!"
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi
          export SIGNING_IDENTITY

          python3 << 'PYEOF'
          import os, re

          path = "ios/App/App.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()

          # Fix bundle ID (App.xcodeproj holds only the App target; pods live in Pods.xcodeproj)
          content = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;', 'PRODUCT_BUNDLE_IDENTIFIER = com.jfeffect.app;', content)

          # Manual signing on the App target's Release configuration (the one with
          # INFOPLIST_FILE = App/Info.plist and name = Release)
          signing = {
              "CODE_SIGN_STYLE": "Manual",
              "CODE_SIGN_IDENTITY": '"%s"' % os.environ["SIGNING_IDENTITY"],
              "DEVELOPMENT_TEAM": "92T56MN5FL",
              "PROVISIONING_PROFILE_SPECIFIER": '"JF Effect App Store Distribution"',
          }
          block_re = re.compile(r"(\w+ /\* Release \*/ = \{\s*isa = XCBuildConfiguration;[^{}]*?buildSettings = \{)(.*?)(\n\t\t\t\};\s*name = Release;)", re.S)
          patched = 0
          def patch(m):
              global patched
              body = m.group(2)
              if "INFOPLIST_FILE = App/Info.plist;" not in body:
                  return m.group(0)
              for key, value in signing.items():
                  body = re.sub(r"\n\s*%s(\[[^\]]*\])? = [^;]*;" % key, "", body)
                  body += "\n\t\t\t\t%s = %s;" % (key, value)
              patched += 1
              return m.group(1) + body + m.group(3)
          content = block_re.sub(patch, content)
          assert patched == 1, f"App target Release configuration found {patched} times (expected 1)"

          with open(path, "w") as f:
              f.write(content)

          print("✅ pbxproj patched: App target Release signs manually with 'JF Effect App Store Distribution'")
          PYEOF

      - name: Build and Archive iOS app
        run: |
          # Signing settings are on the App target (previous step), not global here.
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/JFEffect.xcarchive" \
            archive \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            MARKETING_VERSION=$APP_VERSION \
            "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN_PATH"

      # Proof, in every build's log, that the app going to TestFlight really
      # carries the camera / microphone / photo permission text (without it iOS
      # hides the camera from the web view and closes the app on "Take a photo").
      - name: Check the built app carries the permission text
        run: |
          APP=$(find "$RUNNER_TEMP/JFEffect.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app in the archive"; exit 1; fi
          echo "App: $APP (build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          for k in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null) || { echo "::error::$k is missing from the built app"; exit 1; }
            echo "✅ $k: $v"
          done
          grep -o '"appendUserAgent": *"[^"]*"' "$APP/capacitor.config.json" || echo "::warning::No build number stamp in capacitor.config.json"
          grep -q '"JfPhotosPlugin"' "$APP/capacitor.config.json" || { echo "::error::JfPhotosPlugin is not on the app's plugin list"; exit 1; }
          ls -d "$APP/Frameworks/JfPhotos.framework" >/dev/null 2>&1 || { echo "::error::JfPhotos.framework is not in the app"; exit 1; }
          echo "✅ Camera roll plugin linked"
          # And that no framework or bundle inside the app has the app's own bundle id
          # (the export would try to give it the app's profile, and Apple rejects the collision).
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          [ "$APP_ID" = "com.jfeffect.app" ] || { echo "::error::The app's bundle id is $APP_ID, not com.jfeffect.app"; exit 1; }
          CLASH=0
          while IFS= read -r PL; do
            ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL" 2>/dev/null) || continue
            echo "  ${PL#$APP/}: $ID"
            if [ "$ID" = "$APP_ID" ]; then echo "::error::${PL#$APP/} has the app's bundle id $APP_ID"; CLASH=1; fi
          done < <(find "$APP/Frameworks" "$APP" -mindepth 2 -maxdepth 2 -name Info.plist 2>/dev/null | sort -u)
          [ "$CLASH" = 0 ] || exit 1
          echo "✅ Embedded frameworks and bundles have their own bundle ids"
          # And the app's own privacy manifest (Apple rejects an upload without one).
          [ -f "$APP/PrivacyInfo.xcprivacy" ] || { echo "::error::PrivacyInfo.xcprivacy is not in the built app"; exit 1; }
          plutil -lint "$APP/PrivacyInfo.xcprivacy" || { echo "::error::The built app's PrivacyInfo.xcprivacy isn't a valid plist"; exit 1; }
          echo "✅ Privacy manifest in the app"
          # And that the iPhone app going to TestFlight is portrait only (Capacitor's
          # CAPBridgeViewController reads this list for supportedInterfaceOrientations).
          ORI=$(/usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$APP/Info.plist" 2>/dev/null) || { echo "::error::UISupportedInterfaceOrientations is missing from the built app"; exit 1; }
          echo "$ORI"
          if echo "$ORI" | grep -q "Landscape\|PortraitUpsideDown"; then echo "::error::The built iPhone app can turn sideways"; exit 1; fi
          echo "$ORI" | grep -q "UIInterfaceOrientationPortrait" || { echo "::error::The built iPhone app has no portrait orientation"; exit 1; }
          echo "✅ iPhone app: portrait only"
          # And that the built app's icon is JF Effect's, not Capacitor's placeholder (2.3.8):
          # Xcode copies the iPhone home-screen icon into the app as an optimised PNG; sips
          # turns it back into a normal one for the check.
          ICON=$(find "$APP" -maxdepth 1 -name 'AppIcon60x60@2x*.png' | head -1)
          [ -n "$ICON" ] || { echo "::error::No AppIcon60x60@2x icon in the built app"; ls "$APP"; exit 1; }
          sips -s format png "$ICON" --out "$RUNNER_TEMP/built-icon.png" >/dev/null
          python3 native/ios-app/app_art.py check-app AppIcon-1024.png "$RUNNER_TEMP/built-icon.png" \
            node_modules/@capacitor/cli/assets/ios-pods-template.tar.gz
          # And the device family it was built for (iPhone only unless IOS_SUPPORT_IPAD is "true").
          FAMILY=$(/usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$APP/Info.plist" 2>/dev/null) || { echo "::error::UIDeviceFamily is missing from the built app"; exit 1; }
          echo "UIDeviceFamily: $FAMILY"
          if [ "${{ vars.IOS_SUPPORT_IPAD || 'false' }}" != "true" ] && echo "$FAMILY" | grep -qw 2; then
            echo "::error::The built app supports iPad, but IOS_SUPPORT_IPAD isn't true"; exit 1
          fi
          echo "✅ Device family checked"

      - name: Export and Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>92T56MN5FL</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.jfeffect.app</key>
              <string>JF Effect App Store Distribution</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/JFEffect.xcarchive" \
            -exportPath "$RUNNER_TEMP/JFEffect-export" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload archive as artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JFEffect-xcarchive
          path: ${{ runner.temp }}/JFEffect.xcarchive
          retention-days: 7
