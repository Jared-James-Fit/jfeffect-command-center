name: Android Build — Signed Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          ls android/

      - name: Create Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Write capacitor.config.json
        run: >
          echo '{"appId":"com.jfeffect.app","appName":"JF Effect","webDir":"dist","server":{"url":"https://jfeffect.com","cleartext":false},"plugins":{"Keyboard":{"resize":"native","resizeOnFullScreen":true},"StatusBar":{"style":"DARK","backgroundColor":"#0B0B0F"},"SplashScreen":{"launchShowDuration":2000,"backgroundColor":"#0B0B0F","showSpinner":false}}}'
          > android/app/src/main/assets/capacitor.config.json

      - name: Run cap sync
        run: |
          npx cap sync android 2>&1 | tail -10
          ls android/capacitor.settings.gradle && echo "capacitor.settings.gradle OK"

      - name: Show generated build.gradle
        run: cat android/app/build.gradle

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/jfeffect-upload.jks
          echo "Keystore: $(wc -c < android/app/jfeffect-upload.jks) bytes"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PversionCode=1 \
            -PversionName=1.0.0 \
            -Pandroid.injected.signing.store.file="$(pwd)/app/jfeffect-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            --no-daemon 2>&1 | tail -50

      - name: Verify AAB
        run: |
          find android -name "*.aab" 2>/dev/null
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" && echo "AAB OK: $(ls -lh $AAB)" || (echo "AAB missing"; find android/app/build -type f 2>/dev/null | head -10; exit 1)

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: JFEffect-release-aab-v1.0.0
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JFEffect-keystore-backup
          path: android/app/jfeffect-upload.jks
          retention-days: 90
