name: Android Build — Signed Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      # ── Health Connect ──────────────────────────────────────────────────────
      # OFF unless the repo variable ENABLE_HEALTH_CONNECT is "true". Off = the health
      # plugin is removed before the Android project is generated, so this build is
      # identical to before. Turn it on only after completing the Health Connect
      # declaration in Play Console (Google rejects undeclared health permissions).
      - name: Leave Health Connect out of this build
        if: ${{ vars.ENABLE_HEALTH_CONNECT != 'true' }}
        run: |
          npm pkg delete "dependencies.@capgo/capacitor-health"
          rm -rf node_modules/@capgo/capacitor-health
          echo "Health Connect disabled for this build"

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          ls android/

      - name: Create Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Write capacitor.config.json
        run: >
          echo '{"appId":"com.jfeffect.app","appName":"JF Effect","webDir":"dist","server":{"url":"https://jfeffect.com","cleartext":false},"plugins":{"Keyboard":{"resize":"native","resizeOnFullScreen":true},"StatusBar":{"style":"DARK","backgroundColor":"#0B0B0F"},"SplashScreen":{"launchShowDuration":2000,"backgroundColor":"#0B0B0F","showSpinner":false}}}'
          > android/app/src/main/assets/capacitor.config.json

      - name: Enable Health Connect (minSdk 26, read-only permissions)
        if: ${{ vars.ENABLE_HEALTH_CONNECT == 'true' }}
        run: |
          python3 << 'PYEOF'
          import re
          # Health Connect requires Android 8.0+ (API 26).
          vg = "android/variables.gradle"
          s = open(vg).read()
          s = re.sub(r"minSdkVersion\s*=\s*(\d+)", lambda m: f"minSdkVersion = {max(26, int(m.group(1)))}", s)
          open(vg, "w").write(s)

          # Keep only the READ permissions JF Effect uses; strip every other health
          # permission the plugin declares (Play reviews each one).
          keep = {"READ_STEPS", "READ_ACTIVE_CALORIES_BURNED", "READ_SLEEP", "READ_HEART_RATE",
                  "READ_RESTING_HEART_RATE", "READ_HEART_RATE_VARIABILITY"}
          plugin_manifest = open("node_modules/@capgo/capacitor-health/android/src/main/AndroidManifest.xml").read()
          perms = sorted(set(re.findall(r'android\.permission\.health\.([A-Z_]+)', plugin_manifest)))
          remove = [p for p in perms if p not in keep]
          app = "android/app/src/main/AndroidManifest.xml"
          m = open(app).read()
          if 'xmlns:tools=' not in m:
              m = m.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          lines = "".join(f'    <uses-permission android:name="android.permission.health.{p}" tools:node="remove" />\n' for p in remove)
          m = m.replace("</manifest>", lines + "</manifest>", 1)
          open(app, "w").write(m)
          print(f"✅ Health Connect on: minSdk>=26, kept {sorted(keep)}, removed {len(remove)} permissions")
          PYEOF
          grep -n "minSdkVersion" android/variables.gradle

      - name: Run cap sync
        run: |
          npx cap sync android 2>&1 | tail -10
          ls android/capacitor.settings.gradle && echo "capacitor.settings.gradle OK"

      - name: Show generated build.gradle
        run: cat android/app/build.gradle

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/jfeffect-upload.jks
          echo "Keystore: $(wc -c < android/app/jfeffect-upload.jks) bytes"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PversionCode=1 \
            -PversionName=1.0.0 \
            -Pandroid.injected.signing.store.file="$(pwd)/app/jfeffect-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            --no-daemon 2>&1 | tail -50

      - name: Verify AAB
        run: |
          find android -name "*.aab" 2>/dev/null
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" && echo "AAB OK: $(ls -lh $AAB)" || (echo "AAB missing"; find android/app/build -type f 2>/dev/null | head -10; exit 1)

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: JFEffect-release-aab-v1.0.0
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JFEffect-keystore-backup
          path: android/app/jfeffect-upload.jks
          retention-days: 90
