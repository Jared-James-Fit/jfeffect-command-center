name: Android Build — Signed Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + npm install ─────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # ── 3. Java 17 ───────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools and platform
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            2>&1 | tail -5

      # ── 5. Install Capacitor CLI ─────────────────────────────────────────────
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli

      # ── 6. Add Android platform ──────────────────────────────────────────────
      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          echo "✅ Android platform added"

      # ── 7. Create assets directory and capacitor config ──────────────────────
      # cap sync requires android/app/src/main/assets/ to exist
      - name: Create Android assets directory and capacitor config
        run: |
          mkdir -p android/app/src/main/assets
          # Write capacitor.config.json for the Android project
          cat > android/app/src/main/assets/capacitor.config.json << 'JSON'
          {
            "appId": "com.jfeffect.app",
            "appName": "JF Effect",
            "webDir": "dist",
            "server": {
              "url": "https://jfeffect.com",
              "cleartext": false
            },
            "plugins": {
              "Keyboard": {
                "resize": "native",
                "resizeOnFullScreen": true
              },
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#0B0B0F"
              },
              "SplashScreen": {
                "launchShowDuration": 2000,
                "backgroundColor": "#0B0B0F",
                "showSpinner": false
              }
            }
          }
          JSON
          echo "✅ Assets directory and capacitor.config.json created"
          ls -la android/app/src/main/assets/

      # ── 8. Run cap sync ──────────────────────────────────────────────────────
      - name: Run cap sync
        run: |
          npx cap sync android 2>&1 | tail -20
          echo "✅ cap sync complete"
          ls android/capacitor.settings.gradle 2>/dev/null && echo "✅ capacitor.settings.gradle exists" || echo "WARNING: capacitor.settings.gradle missing"

      # ── 9. Patch Android project for Play Store compliance ───────────────────
      - name: Patch Android project for Play Store compliance
        run: |
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i 's/versionCode [0-9]*/versionCode 1/' "$GRADLE"
            sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' "$GRADLE"
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/' "$GRADLE"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$GRADLE"
            echo "✅ Patched build.gradle"
            grep -E "versionCode|versionName|targetSdk|compileSdk" "$GRADLE" | head -6
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:usesCleartextTraffic="true"/android:usesCleartextTraffic="false"/' "$MANIFEST"
            echo "✅ Cleartext HTTP disabled"
          fi

      # ── 10. Restore signing keystore ─────────────────────────────────────────
      - name: Restore Android signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/jfeffect-upload.jks
          echo "Keystore size: $(wc -c < android/app/jfeffect-upload.jks) bytes"
          echo "✅ Keystore restored"

      # ── 11. Build signed release AAB ─────────────────────────────────────────
      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/jfeffect-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            --no-daemon \
            2>&1 | tail -40

      # ── 12. Verify and upload AAB ────────────────────────────────────────────
      - name: Verify AAB exists
        run: |
          echo "Searching for AAB files..."
          find android -name "*.aab" 2>/dev/null
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "✅ AAB found: $(ls -lh $AAB_PATH)"
          else
            echo "❌ AAB not found"
            find android/app/build/outputs -type f 2>/dev/null | head -20 || echo "No build outputs"
            exit 1
          fi

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: JFEffect-release-aab-v1.0.0
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload keystore backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JFEffect-keystore-backup
          path: android/app/jfeffect-upload.jks
          retention-days: 90
