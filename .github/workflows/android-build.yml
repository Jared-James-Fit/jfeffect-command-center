name: Android Build — Signed Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + npm install ─────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # ── 3. Java 17 (required by Gradle / Android build tools) ────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools and platform
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            2>&1 | tail -5

      # ── 5. Add Capacitor Android platform ────────────────────────────────────
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: |
          # Remove any stale android folder
          rm -rf android
          npx cap add android
          echo "✅ Android platform added"

      # ── 6. Patch AndroidManifest and build.gradle ────────────────────────────
      - name: Patch Android project for Play Store compliance
        run: |
          # Ensure cleartext HTTP is disabled (already set in capacitor.config.ts)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "usesCleartextTraffic=\"true\"" "$MANIFEST" 2>/dev/null; then
            sed -i 's/android:usesCleartextTraffic="true"/android:usesCleartextTraffic="false"/' "$MANIFEST"
            echo "✅ Disabled cleartext HTTP in manifest"
          fi

          # Set version name and version code in build.gradle
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i 's/versionCode [0-9]*/versionCode 1/' "$GRADLE"
            sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' "$GRADLE"
            echo "✅ Set versionCode=1, versionName=1.0.0 in build.gradle"
          fi

          # Set target SDK to 35
          if [ -f "$GRADLE" ]; then
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/' "$GRADLE"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$GRADLE"
            echo "✅ Set targetSdkVersion=35 in build.gradle"
          fi

      # ── 7. Restore signing keystore ──────────────────────────────────────────
      - name: Restore Android signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/jfeffect-upload.jks
          echo "Keystore size: $(wc -c < android/app/jfeffect-upload.jks) bytes"
          echo "✅ Keystore restored"

      # ── 8. Build signed release AAB ──────────────────────────────────────────
      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/jfeffect-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            --no-daemon \
            2>&1 | tail -30
          echo "✅ Release AAB built"

      # ── 9. Verify AAB ────────────────────────────────────────────────────────
      - name: Verify AAB exists
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "✅ AAB found: $(ls -lh $AAB_PATH)"
          else
            echo "❌ AAB not found at expected path"
            find android/app/build/outputs -name "*.aab" 2>/dev/null || echo "No AAB files found"
            exit 1
          fi

      # ── 10. Upload AAB as artifact ───────────────────────────────────────────
      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: JFEffect-release-aab-v1.0.0
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 11. Upload keystore backup (encrypted) ───────────────────────────────
      - name: Upload keystore backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JFEffect-keystore-backup
          path: android/app/jfeffect-upload.jks
          retention-days: 90
