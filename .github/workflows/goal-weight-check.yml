name: Goal weight checks
on:
  pull_request:
    paths:
      - 'src/components/goals/**'
      - 'src/components/compact-weight-input.tsx'
      - 'src/lib/dual-weight.ts'
      - 'src/lib/goal-intel/**'
      - 'src/lib/cleo-actions*'
      - 'src/lib/cleo-tools.server.ts'
      - 'src/components/admin/books/cleo-action-card.tsx'
      - 'src/test/compact-goal-weight.test.ts'
      - '.github/workflows/goal-weight-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install locked dependencies
        run: |
          sed -i -E 's#https://europe-west[0-9]-npm\.pkg\.dev/lovable-core-prod/[a-z0-9-]+/#https://registry.npmjs.org/#g' bun.lock
          bun install --frozen-lockfile --ignore-scripts
      - run: bun run test src/test/compact-goal-weight.test.ts src/test/goal-intel.test.ts src/test/goal-intel-worker.test.ts src/test/post-dual-weights.test.ts src/test/coaching-sessions.test.ts src/test/cleo-chats.test.ts src/test/client-workspace-tabs.test.ts src/test/cleo-actions-run-as-requester.test.ts src/test/cleo-goal-actions.test.ts
      - run: node --max-old-space-size=12288 ./node_modules/typescript/bin/tsc --noEmit
      - run: npm run build
