name: Fix workout duration source
on:
  push:
    paths:
      - '.github/workflows/fix-workout-duration-source.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch duration source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/workout-day/WorkoutDayView.tsx')
          s=p.read_text()
          old='''  const [lastSummary, setLastSummary] = useState<WorkoutSummary | null>(null);\n  const [lastSessionRating, setLastSessionRating] = useState<number | null>(null);'''
          new='''  const [lastSummary, setLastSummary] = useState<WorkoutSummary | null>(null);\n  const [lastSessionRating, setLastSessionRating] = useState<number | null>(null);\n  // Snapshot the authoritative local session clock at finish. The completion\n  // query can still contain an older draft duration for a render or two, and\n  // the local timer is cleared immediately after persistence. Keeping this\n  // value prevents the celebration screen from showing that stale draft.\n  const [lastFinishedDurationMin, setLastFinishedDurationMin] = useState<number | null>(null);'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    const sessionSeconds = sessionDurationSeconds(dayId);\n    const activeMin = sessionDurationMin(dayId) ?? estimateDurationFromLogs(firstLogAt);\n    const resolvedDurationMin = Number.isFinite(typedMin) && typedMin > 0\n      ? typedMin\n      : activeMin ?? completion?.actual_duration_min ?? null;'''
          new='''    const sessionSeconds = sessionDurationSeconds(dayId);\n    const sessionMin = sessionDurationMin(dayId);\n    const fallbackMin = estimateDurationFromLogs(firstLogAt);\n    // The workout-session clock is the source of truth. A hydrated/stale\n    // actualMin draft must never override a valid running timer. Only fall\n    // back to a manually-entered/stored value when no trustworthy timer was\n    // captured for this session.\n    const resolvedDurationMin = sessionMin\n      ?? (Number.isFinite(typedMin) && typedMin > 0 ? typedMin : null)\n      ?? fallbackMin\n      ?? completion?.actual_duration_min\n      ?? null;\n    setLastFinishedDurationMin(resolvedDurationMin);'''
          assert old in s
          s=s.replace(old,new,1)
          old='''            completion?.actual_duration_min ?? sessionDurationMin(dayId) ?? null'''
          new='''            recapFromSubmitRef.current\n              ? (lastFinishedDurationMin ?? completion?.actual_duration_min ?? null)\n              : (completion?.actual_duration_min ?? sessionDurationMin(dayId) ?? null)'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-workout-duration-source.yml
      - name: Commit fix
        run: |
          git config user.name 'JF Effect automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/workout-day/WorkoutDayView.tsx .github/workflows/fix-workout-duration-source.yml
          git commit -m 'Use workout session clock as completion duration source'
          git push origin main
