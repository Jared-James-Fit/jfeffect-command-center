name: Fix duplicate-looking check-in timeline
on:
  push:
    paths: ['.github/workflows/fix-checkin-double-render.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Consolidate completed check-ins in chat
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/message-thread.tsx')
          s = p.read_text()

          old = '''        // Still update conversation state and notification counts\n        qc.invalidateQueries({ queryKey: ["conversation-states"] });\n        qc.invalidateQueries({ queryKey: ["notifications"] });'''
          new = '''        // Still update conversation state and notification counts. If this is\n        // a submitted messenger check-in, also refresh its shared check-in\n        // query immediately so an already-open request card never stays in a\n        // stale \"Waiting for client\" state.\n        qc.invalidateQueries({ queryKey: ["conversation-states"] });\n        qc.invalidateQueries({ queryKey: ["notifications"] });\n        for (const att of newMsg.attachments ?? []) {\n          if (att?.kind === "checkin_submission" && att.checkin_submission_id) {\n            qc.invalidateQueries({ queryKey: ["messenger-checkin", att.checkin_submission_id] });\n          }\n        }'''
          assert old in s, 'realtime insert invalidation block not found'
          s = s.replace(old, new, 1)

          old = '''  const visibleMessages = useMemo(\n    () => role === "admin" ? allMessages : allMessages.filter((m) => !m.is_internal_note),\n    [allMessages, role],\n  );'''
          new = '''  const visibleMessages = useMemo(() => {\n    const base = role === "admin"\n      ? allMessages\n      : allMessages.filter((m) => !m.is_internal_note);\n\n    // A messenger check-in has two persisted timeline events by design:\n    // the coach request and the client's completed submission. Once the\n    // submission exists, showing both cards makes it look like the coach sent\n    // a second check-in. Keep the DB audit trail, but collapse the completed\n    // pair to the submission/recap card in the visible chat. Pending requests\n    // still render normally until the client actually submits.\n    const submittedIds = new Set<string>();\n    for (const message of base) {\n      for (const att of message.attachments ?? []) {\n        if (att?.kind === "checkin_submission" && att.checkin_submission_id) {\n          submittedIds.add(att.checkin_submission_id);\n        }\n      }\n    }\n    if (submittedIds.size === 0) return base;\n\n    return base.filter((message) => !(message.attachments ?? []).some((att) =>\n      att?.kind === "checkin_request" &&\n      !!att.checkin_submission_id &&\n      submittedIds.has(att.checkin_submission_id),\n    ));\n  }, [allMessages, role]);'''
          assert old in s, 'visibleMessages block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify production build
        run: npm install --legacy-peer-deps && npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/fix-checkin-double-render.yml
          git config user.name 'JF Effect automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/message-thread.tsx .github/workflows/fix-checkin-double-render.yml
          git commit -m 'Collapse completed check-in request and response in chat'
          git push origin main
